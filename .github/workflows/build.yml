name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# lets the tag build make the release and upload Mutual.exe to it
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Mutual.sln -c Debug
      # gpu/capture tests live in tools/Mutual.Lab and need a real desktop, these dont
      - run: dotnet test tests/Mutual.Core.Tests --no-build
      - name: publish
        run: dotnet publish src/Mutual -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Mutual
          path: publish/Mutual.exe
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Mutual.exe
