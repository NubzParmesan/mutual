name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# the tag build makes the release, uploads Mutual.exe and signs a record of where it came from
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # every action is pinned to an exact commit so a hijacked tag upstream cant change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      # packages come from the lock files, a changed package fails the build
      - run: dotnet restore Mutual.sln --locked-mode
      - run: dotnet build Mutual.sln -c Debug --no-restore
      # gpu and capture tests live in tools/Mutual.Lab and need a real desktop, these dont
      - run: dotnet test tests/Mutual.Core.Tests --no-build

      - name: publish
        shell: bash
        run: |
          VERSION=1.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          # the release shape (win-x64, self contained, single file) is set in src/Mutual/Mutual.csproj
          dotnet publish src/Mutual -c Release -p:DebugType=none -p:Version=$VERSION -o publish
          cd publish && sha256sum Mutual.exe | tee Mutual.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mutual
          path: |
            publish/Mutual.exe
            publish/Mutual.exe.sha256

      - name: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: publish/Mutual.exe

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            publish/Mutual.exe
            publish/Mutual.exe.sha256
